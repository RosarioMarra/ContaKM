<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ContaKM – Accesso</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: "Roboto Condensed", "Helvetica Neue", system-ui, sans-serif; text-align: center;
      background: radial-gradient(120% 60% at 50% -10%, #38bdf833, transparent 60%), #0f1b2d; color: #eef2f7;
    }
    main { max-width: 360px; display: grid; gap: 16px; justify-items: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 0; font-size: 26px; }
    p { margin: 0; color: #9fb0c4; font-size: 17px; line-height: 1.4; }
    a.btn {
      display: block; width: 100%; padding: 18px; border-radius: 16px; box-sizing: border-box;
      background: #38bdf8; color: #062033; font-size: 22px; font-weight: 800; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="icons/logo.svg" alt="">
    <h1 id="title">Accesso riuscito</h1>
    <p id="text">Torno nell'app ContaKM…</p>
    <a class="btn" id="open" href="#">Apri ContaKM</a>
  </main>
  <script>
    // Google (tramite Supabase) torna qui con ?code=…: si passa il codice all'app Android, che completa l'accesso.
    // Questa pagina non usa il codice da sola: serve la chiave segreta che l'app ha tenuto per sé.
    (function () {
      var query = location.search.replace(/^\?/, '');
      var failed = /(^|&)error/.test(query);
      var scheme = 'io.github.rosariomarra.contakm';
      var intent = 'intent://auth' + (query ? '?' + query : '') +
        '#Intent;scheme=' + scheme + ';package=' + scheme + ';end';
      var direct = scheme + '://auth' + (query ? '?' + query : '');
      var link = /Android/i.test(navigator.userAgent) ? intent : direct;
      document.getElementById('open').href = link;
      if (failed) {
        document.getElementById('title').textContent = 'Accesso non riuscito';
        document.getElementById('text').textContent = 'Torna nell\'app e riprova.';
      } else if (!/(^|&)code=/.test(query)) {
        document.getElementById('title').textContent = 'ContaKM';
        document.getElementById('text').textContent = 'Apri l\'app per continuare.';
      }
      // Prova a riaprire l'app da sola; se il telefono lo blocca resta il pulsante
      setTimeout(function () { location.href = link; }, 150);
      setTimeout(function () {
        if (!document.hidden && !failed) document.getElementById('text').textContent = 'Se l\'app non si è aperta da sola, premi il pulsante.';
      }, 1800);
    })();
  </script>
</body>
</html>
